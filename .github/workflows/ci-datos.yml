name: ci-datos
on:
  pull_request:
    paths: ["data_engineering/**", "docs/formato_resultados.md"]
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validar formato de los JSON
        run: python data_engineering/scripts/validar_formato.py
